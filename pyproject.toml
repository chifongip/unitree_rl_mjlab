[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree_rl_mjlab"
version = "0.0.1"
description = "RL policies for Unitree robots on mjlab"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "mjlab==1.5.2",
    "joblib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
override-dependencies = ["warp-lang==1.14.0"]
# PyTorch index for CUDA builds
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
